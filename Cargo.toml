[workspace]
members = [
  "crates/hashoverlay",
  "crates/lap-engine",
  "crates/lmu-telemetry",
  "crates/overlay-renderer",
  "crates/storage",
  "crates/telemetry-engine",
]
resolver = "2"
exclude = ["settings/src-tauri"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/gut0to/LMU-Overlay"

[workspace.dependencies]
anyhow = "1.0"
env_logger = "0.11"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
