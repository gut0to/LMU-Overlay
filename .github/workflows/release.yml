name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  windows:
    name: Windows Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: settings/package-lock.json

      - name: Build overlay CLI
        run: cargo build --workspace --release

      - name: Install settings dependencies
        run: npm ci
        working-directory: settings

      - name: Build settings frontend
        run: npm run build
        working-directory: settings

      - name: Build settings app
        run: npm run tauri build
        working-directory: settings

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\HashOverlay | Out-Null
          Copy-Item target\release\hashoverlay.exe dist\HashOverlay\
          Copy-Item README.md dist\HashOverlay\
          Copy-Item LICENSE dist\HashOverlay\
          Copy-Item THIRD_PARTY_LICENSES.md dist\HashOverlay\
          Copy-Item docs\usage.md dist\HashOverlay\USAGE.md
          Copy-Item docs\widgets.md dist\HashOverlay\WIDGETS.md
          $installer = Get-ChildItem settings\src-tauri\target\release\bundle\nsis -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw 'Tauri NSIS installer was not produced' }
          Copy-Item $installer.FullName dist\HashOverlay-Setup-x64.exe
          Compress-Archive -Path dist\HashOverlay\* -DestinationPath dist\HashOverlay-overlay-x64.zip -Force

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v6
        with:
          name: HashOverlay-overlay-x64
          path: |
            dist/HashOverlay-overlay-x64.zip
            dist/HashOverlay-Setup-x64.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/HashOverlay-overlay-x64.zip
            dist/HashOverlay-Setup-x64.exe
