name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Verify release build
        run: cargo build --workspace --release

  settings:
    name: Settings App
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: settings/package-lock.json

      - name: Install settings dependencies
        run: npm ci
        working-directory: settings

      - name: Audit settings dependencies
        run: npm audit --audit-level=moderate
        working-directory: settings

      - name: Build settings frontend
        run: npm run build
        working-directory: settings

      - name: Test settings state and geometry
        run: npm test
        working-directory: settings

      - name: Build overlay resource
        run: cargo build --release

      - name: Test settings shell
        run: cargo test --manifest-path settings/src-tauri/Cargo.toml

      - name: Lint settings shell
        run: cargo clippy --manifest-path settings/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build Windows installer candidate
        run: npm run tauri build
        working-directory: settings

      - name: Verify NSIS installer output
        shell: pwsh
        run: |
          $installer = Get-ChildItem settings\src-tauri\target\release\bundle\nsis -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw 'Tauri NSIS installer was not produced' }
