name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    name: Rust
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  settings:
    name: Settings App
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: settings/package-lock.json

      - name: Install settings dependencies
        run: npm ci
        working-directory: settings

      - name: Audit settings dependencies
        run: npm audit --audit-level=moderate
        working-directory: settings

      - name: Build settings frontend
        run: npm run build
        working-directory: settings

      - name: Check settings shell
        run: cargo check --manifest-path settings/src-tauri/Cargo.toml
