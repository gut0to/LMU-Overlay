[package]
name = "hashoverlay-settings"
version = "1.0.5"
edition = "2021"
license = "MIT"
repository = "https://github.com/gut0to/LMU-Overlay"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
overlay-renderer = { path = "../../crates/overlay-renderer" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
toml = "0.8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }
